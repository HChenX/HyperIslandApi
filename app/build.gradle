plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.hchen.hyperislandapi.example'
    compileSdk 37

    defaultConfig {
        applicationId "com.hchen.hyperislandapi.example"
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':HyperIslandApi')

    implementation libs.appcompat
    implementation libs.activity
}